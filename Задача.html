<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Решение алгоритмической задачи</title>
</head>
<body>

<p>Даны вещественные числа A, B, C. <br> Определить, выполняется ли A < B < C или A < B > C.</p>

<form action="https://www.google.com/search" id="UserEnter" name="UserEnter" target="_blank">

<ul style="list-style-type: none">
    <li>Для поисковика:
        <input id="q" name="q" value="search">
    </li>

    <li>A:<input id="a" name="a" type="number" value="10"></li>
    <li>B:<input id="b" name="b" type="number" value="20"></li>
    <li>C:<input id="c" name="c" type="number" value="30"></li>
    <li>Результат:<input id="result" name="result" value="не определен" readonly></li>
    <li><input id="verify" type="button" value="Проверить"></li>
    <li><input id="send" type="button" value="Отправить"></li>
</ul>
</form>

    <script src="Задача.js"></script>

</body>
</html>
